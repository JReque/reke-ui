name: PR Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-pr-title:
    runs-on: ubuntu-latest
    steps:
      # Validates the PR title follows Conventional Commits (feat:, fix:, etc.)
      # so release-please can derive the correct version bump. Use squash merge
      # so the validated PR title becomes the commit on the base branch.
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
